<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> El rincón del terror </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <lib-monster-card
    titulo="Representación de la Santa Compana"
    texto="La Santa Compaña se suele representar de la siguiente manera, como esqueletos o seres cadavericos en filas, guiados por un mortal"
    foto="assets/img/image1.png"
    boton="Oir sus campanadas"
  ></lib-monster-card>
  <lib-monster-card
    titulo="Estatuas de la Santa Compana"
    texto="Aquí se ven de otra forma, con estatuas, siendo una procesión"
    foto="assets/img/image2.png"
    boton="Oir sus campanadas"
  ></lib-monster-card>
  <lib-monster-card
    titulo="Otra idea de la Santa Compana"
    texto="Esta es la que sería la versión asturiana, la güestia, encapuchados que conoce un moribundo que rodean su casa y tras dar tres vueltas, el enfermo muere."
    foto="assets/img/image3.jpg"
    boton="Oir sus campanadas"
  ></lib-monster-card>
  <lib-monster-card
    titulo="¿Qué hacer?"
    texto="¿Quien no se ha topado con estos fantasmas a salir a comprar el pan? Por suerte, defenderse de ellos es fácil, basta con aferrarse a una cruz, hacer una cruz con los brazos, decir ''cruz ya tengo'' cuando el mortal te la ofrezca o tener las manos ocupadas cuando te quieran dar la cruz (que educados)"
    foto="assets/img/image4.jpg"
    boton="Oir sus campanadas"
  ></lib-monster-card>
  <lib-monster-card
    titulo="Larga vida al Rock & Roll"
    texto="No se que tiene este pilla pilla de fantasmas de rockero, pero han inspirado muchas canciones. Montañas tiene un tema llamado ''La güestia', al igual que el grupo Spanta la Xente, y el grupo de Los Suaves tiene un album entero con ese nombre"
    foto="assets/img/image5.jpg"
    boton="Oir sus campanadas"
  ></lib-monster-card>
</ion-content>
